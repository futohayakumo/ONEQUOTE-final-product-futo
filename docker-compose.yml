# `docker compose up` brings up the database and the quotation service.
#
# The site itself is static and does not need to be in here: `pnpm dev` or
# any static host serves it, and it reaches the API at NEXT_PUBLIC_API_URL.
# The database volume persists the fetched rates and the quotations issued,
# so a restart does not lose the record.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quotation
      POSTGRES_USER: quotation
      POSTGRES_PASSWORD: quotation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotation -d quotation"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://quotation:quotation@db:5432/quotation
      PORT: "4000"
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
